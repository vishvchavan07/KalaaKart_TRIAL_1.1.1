<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Sign In — KalaaKart</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/KalaaKart_TRIAL_1.1.1/platform/shared/design.css"/>
  <style>
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
    .auth-wrap{position:relative;z-index:1;width:100%;max-width:420px}
    .auth-logo{text-align:center;margin-bottom:28px}
    .auth-logo-text{font-size:1.1rem;font-weight:800;color:var(--accent-light);letter-spacing:.04em}
    .auth-logo-sub{font-size:.78rem;color:var(--text-muted);margin-top:4px}
    .auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:32px;backdrop-filter:blur(24px)}
    .auth-title{font-size:1.3rem;font-weight:800;margin-bottom:6px}
    .auth-sub{font-size:.84rem;color:var(--text-muted);margin-bottom:24px}
    .auth-form{display:flex;flex-direction:column;gap:18px}
    .demo-box{background:var(--accent-dim);border:1px solid rgba(132,90,255,.25);border-radius:var(--r-sm);padding:12px 14px;font-size:.78rem;color:var(--accent-light);margin-bottom:4px}
    .auth-footer{text-align:center;margin-top:20px;font-size:.82rem;color:var(--text-muted)}
    .auth-footer a{color:var(--accent-light);font-weight:600}
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="auth-wrap">
    <div class="auth-logo">
      <div class="auth-logo-text">● KalaaKart</div>
      <div class="auth-logo-sub">Student Rental Marketplace</div>
    </div>
    <div class="auth-card">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Sign in to your account to continue.</p>
      <div class="demo-box">
        🔑 <strong>Demo accounts:</strong> arjun@comp.edu / demo123 &nbsp;·&nbsp; admin@kalaakart.in / admin123
      </div>
      <form class="auth-form" id="login-form" novalidate>
        <div class="field">
          <label class="label" for="email">Email</label>
          <input class="input" id="email" type="email" placeholder="you@college.edu" required/>
        </div>
        <div class="field">
          <label class="label" for="password">Password</label>
          <input class="input" id="password" type="password" placeholder="••••••••" required/>
          <div class="field-err" id="login-err"></div>
        </div>
        <button class="btn btn-primary btn-full" id="login-btn" type="submit">Sign In</button>
      </form>
      <div class="auth-footer">Don't have an account? <a href="/KalaaKart_TRIAL_1.1.1/platform/auth/register.html">Register</a></div>
    </div>
  </div>
  <script src="/KalaaKart_TRIAL_1.1.1/platform/shared/api.js"></script>
  <script>
    redirectIfLoggedIn();
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const err = document.getElementById('login-err');
      btn.disabled = true; btn.textContent = 'Signing in…';
      err.textContent = '';
      try {
        const d = await api.post('/api/auth/login', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });
        setSession(d.token, d.user);
        window.location.href = '/KalaaKart_TRIAL_1.1.1/platform/index.html';
      } catch(ex) {
        err.textContent = ex.message;
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
